[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "path-smoking-resumption"
version = "0.1.0"
description = "CSE366 reproducible PATH smoking resumption research prototype"
requires-python = ">=3.13"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn", "scipy", "joblib", "streamlit", "altair"]

[project.optional-dependencies]
dev = ["pytest"]
research = ["matplotlib", "pypdf", "python-pptx", "shap", "xgboost"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
